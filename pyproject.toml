[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-manifest-updater"
version = "0.1.0"
description = "Discover local Steam app manifests and run explicitly configured SteamCMD maintenance jobs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "James Mulvaney"}]
keywords = ["steam", "steamcmd", "manifest", "maintenance", "scheduled-task"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "License :: OSI Approved :: MIT License"]

[tool.setuptools.packages.find]
include = ["steam_manifest_updater*"]
